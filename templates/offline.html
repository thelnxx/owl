{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - {{ site_settings.site_title|default:"LnX Platform" }}</title>

    <script>
        (function () {
            const savedTheme = localStorage.getItem("lnx_theme") || "dark";
            document.documentElement.setAttribute("data-bs-theme", savedTheme);
        })();
    </script>

    <link href="{% static 'css/bootstrap.css' %}" rel="stylesheet">

    <!-- Standalone Fallback Styles (Guarantees clean UI even if external CSS fails) -->
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: #121417;
            color: #e9ecef;
        }
        [data-bs-theme="light"] body {
            background-color: #f8f9fa;
            color: #212529;
        }
        .offline-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .offline-card {
            width: 100%;
            max-width: 440px;
            background-color: #1b1f24;
            border: 1px solid #2d333b;
            border-radius: 0.75rem;
            padding: 2.25rem 2rem;
            text-align: center;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.35);
        }
        [data-bs-theme="light"] .offline-card {
            background-color: #ffffff;
            border-color: #dee2e6;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
        }
        .offline-status {
            background-color: #121417;
            border: 1px solid #2d333b;
            border-radius: 0.5rem;
            padding: 0.6rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }
        [data-bs-theme="light"] .offline-status {
            background-color: #f1f3f5;
            border-color: #dee2e6;
        }
        .offline-btn {
            display: block;
            width: 100%;
            padding: 0.6rem 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #000;
            background-color: #0dcaf0;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        .offline-btn:hover {
            background-color: #31d2f2;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-body text-body">

    <main class="offline-wrapper flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="offline-card card bg-body-tertiary border-secondary-subtle shadow text-center">
            <div class="card-body p-2">
                <div class="text-warning mb-3" style="color: #ffc107;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M10.706 3.294A12.6 12.6 0 0 0 8 3C5.259 3 2.723 3.882.663 5.379a.485.485 0 0 0-.048.736.52.52 0 0 0 .668.05A11.45 11.45 0 0 1 8 4q.946 0 1.852.148zM8 6c-1.905 0-3.68.56-5.166 1.526a.48.48 0 0 0-.063.745.525.525 0 0 0 .652.065 8.45 8.45 0 0 1 3.51-1.27zm2.596 1.404.785-.785q.947.362 1.785.907a.482.482 0 0 1 .063.745.525.525 0 0 1-.652.065 8.5 8.5 0 0 0-1.98-.932zM8 10l.933-.933a6.5 6.5 0 0 1 2.013.637c.285.145.326.524.1.75l-.015.015a.53.53 0 0 1-.611.09A5.5 5.5 0 0 0 8 10m4.905-4.905.747-.747q.886.451 1.685 1.03a.485.485 0 0 1 .047.737.52.52 0 0 1-.668.05 11.5 11.5 0 0 0-1.811-1.07M9.02 11.78c.238.14.236.464.04.66l-.707.706a.5.5 0 0 1-.707 0l-.707-.707c-.195-.195-.197-.518.04-.66A2 2 0 0 1 8 11.5c.374 0 .723.102 1.021.28zm4.355-9.905a.53.53 0 0 1 .75.75l-10.75 10.75a.53.53 0 0 1-.75-.75z"/>
                    </svg>
                </div>

                <h1 class="h4 fw-bold mb-2">You Are Offline</h1>
                <p class="text-body-secondary small mb-4" style="opacity: 0.8; font-size: 0.9rem; line-height: 1.5;">
                    No active internet connection was detected. Check your network cable or Wi-Fi connection; this page will automatically reload once you are back online.
                </p>

                <div class="offline-status p-2 rounded bg-body border border-secondary-subtle small text-body-secondary mb-4" id="connectionStatusBox">
                    Status: <strong class="text-danger" style="color: #dc3545;">Disconnected</strong>
                </div>

                <button type="button" onclick="window.location.reload()" class="offline-btn btn btn-info text-dark fw-semibold w-100">
                    Retry Connection
                </button>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener("online", function () {
            const box = document.getElementById("connectionStatusBox");
            if (box) {
                box.innerHTML = 'Status: <strong class="text-success" style="color: #198754;">Connection restored! Reloading...</strong>';
            }
            setTimeout(function () {
                window.location.reload();
            }, 800);
        });
    </script>
</body>
</html>
