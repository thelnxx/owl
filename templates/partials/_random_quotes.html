<div class="card bg-body-tertiary border-secondary-subtle shadow-sm">
    <div class="card-header border-secondary-subtle">
        <span class="fw-semibold text-uppercase small">
            <i class="fa-solid fa-shuffle me-2 text-warning"></i>Random Excerpts
        </span>
    </div>
    <div class="card-body p-2">
        {% for item in random_article_quotes %}
            <div class="p-2 rounded bg-body border border-secondary-subtle {% if not forloop.last %}mb-2{% endif %}">
                {% if item.category %}
                    <span class="badge bg-info-subtle text-info mb-1" style="font-size: 0.7rem;">
                        {{ item.category.name }}
                    </span>
                {% endif %}
                <a href="{% url 'app_articles:detail' item.slug %}"
                    class="d-block fw-semibold small text-body text-decoration-none mb-1">
                    {{ item.title }}
                </a>
                <p class="text-body-secondary mb-1" style="font-size: 0.78rem; line-height: 1.35;">
                    "{{ item.snippet }}"
                </p>
                <div class="d-flex justify-content-between align-items-center text-body-secondary" style="font-size: 0.7rem;">
                    <span>
                        <i class="fa-regular fa-user me-1"></i>{{ item.author.username|default:"System" }}
                    </span>
                    <a href="{% url 'app_articles:detail' item.slug %}" class="text-info text-decoration-none">
                        Read &rarr;
                    </a>
                </div>
            </div>
        {% empty %}
            <div class="text-center text-body-secondary small py-4 px-2">
                <i class="fa-regular fa-newspaper d-block fs-5 mb-1"></i>
                Published article excerpts will appear here.
            </div>
        {% endfor %}
    </div>
</div>
