{% extends "base.html" %}

{% block title %}Password Reset Complete - {{ site_settings.site_title|default:"LnX Platform" }}{% endblock %}

{% block main_layout %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card bg-body-tertiary border-secondary-subtle shadow text-center">
                <div class="card-body p-4 p-md-5">
                    <div class="display-5 text-success mb-3">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <h1 class="h4 fw-bold mb-3">Password Updated</h1>
                    <p class="text-body-secondary mb-4">
                        Your password has been reset successfully. You can now sign in with your new credentials.
                    </p>
                    <a href="{% url 'app_account:login' %}" class="btn btn-info text-dark fw-semibold w-100">
                        <i class="fa-solid fa-right-to-bracket me-1"></i>Log In Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
